<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrawApp</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body data-theme="dark">
    <div class="app">
        <main class="canvas-area" id="canvas-area">
            <canvas id="canvas"></canvas>
            <div class="cursor-indicator" id="cursor-indicator"></div>

            <div class="drop-overlay" id="drop-overlay">
                <div class="drop-hint">Отпустите, чтобы добавить как слой</div>
            </div>

            <div class="status-bar" id="status-bar">
                <span class="status-item">
                    <span class="status-label">Инстр:</span>
                    <span id="status-tool">Кисть</span>
                </span>
                <span class="status-item">
                    <span class="status-label">Толщ:</span>
                    <span id="status-size">4</span>
                </span>
                <span class="status-item">
                    <span class="status-label">Цвет:</span>
                    <span class="status-color-box" id="status-color-box"></span>
                    <span id="status-color">#000000</span>
                </span>
                <span class="status-item">
                    <span class="status-label">X,Y:</span>
                    <span id="status-coords">—, —</span>
                </span>
            </div>

            <div class="zoom-controls" id="zoom-controls">
                <button class="zoom-btn" id="zoom-out" title="Уменьшить">−</button>
                <input type="range" id="zoom-slider" min="-300" max="300" value="0" step="1">
                <button class="zoom-btn" id="zoom-in" title="Увеличить">+</button>
                <button class="zoom-btn zoom-100" id="zoom-reset" title="100%">1:1</button>
            </div>

            <div class="spinner-overlay" id="spinner-overlay">
                <div class="spinner"></div>
            </div>
        </main>

        <button class="sidebar-toggle" id="sidebar-toggle" title="Свернуть панель">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m9 18 6-6-6-6"/>
            </svg>
        </button>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="app-title">DrawApp</span>
                <button class="icon-btn" id="theme-toggle" title="Сменить тему">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                    </svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                    </svg>
                </button>
            </div>

            <div class="divider"></div>

            <div class="tool-group">
                <button class="tool-btn active" data-tool="brush" title="Кисть (B)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9.06 11.9l8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"/>
                        <path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"/>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="pencil" title="Карандаш (P)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="eraser" title="Ластик (E)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 20H7L3 16a2 2 0 0 1 0-3L13 3a2 2 0 0 1 3 0l5 5a2 2 0 0 1 0 3L11 21"/>
                        <path d="M6 11l7 7"/>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="fill" title="Заливка (G)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/>
                        <path d="m5 2 5 5"/>
                        <path d="M2 13h15"/>
                        <path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="eyedropper" title="Пипетка (I)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m2 22 1-1h3l9-9"/>
                        <path d="M3 21v-3l9-9"/>
                        <path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.5 1.5a2 2 0 0 1-.5 2.2L16 15"/>
                        <path d="m18 6-3-3"/>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="hand" title="Рука (H)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/>
                        <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/>
                        <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/>
                        <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
                    </svg>
                </button>
            </div>

            <div class="divider"></div>

            <div class="section">
                <label class="color-current">
                    <input type="color" id="color" value="#000000">
                </label>
                <div class="quick-colors" id="quick-colors"></div>
                <button class="add-color" id="add-color">+ Сохранить цвет</button>
                <p class="hint">ПКМ по цвету — удалить</p>
            </div>

            <div class="divider"></div>

            <div class="section">
                <div class="size-header">
                    <div class="size-preview-wrap">
                        <div class="size-preview" id="size-preview"></div>
                    </div>
                    <span class="size-value" id="size-value">4</span>
                </div>
                <input type="range" id="size" min="1" max="80" value="4">
            </div>

            <div class="divider"></div>

            <div class="section">
                <div class="layers-header">
                    <span>Слои</span>
                    <button class="icon-btn" id="add-layer" title="Добавить слой">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                    </button>
                </div>
                <div class="layers-list" id="layers-list"></div>
                <div class="layers-actions">
                    <button class="icon-btn" id="move-layer-up" title="Вверх">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m18 15-6-6-6 6"/>
                        </svg>
                    </button>
                    <button class="icon-btn" id="move-layer-down" title="Вниз">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m6 9 6 6 6-6"/>
                        </svg>
                    </button>
                    <button class="icon-btn danger" id="delete-layer" title="Удалить слой">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h18"/>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="divider"></div>

            <div class="section">
                <div class="history-group">
                    <button class="history-btn" id="undo" title="Отменить (Ctrl+Z)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 7v6h6"/>
                            <path d="M21 17a9 9 0 0 0-15-6.7L3 13"/>
                        </svg>
                        <span>Отменить</span>
                        <span class="badge" id="undo-count">0</span>
                    </button>
                    <button class="history-btn" id="redo" title="Повторить (Ctrl+Y)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 7v6h-6"/>
                            <path d="M3 17a9 9 0 0 1 15-6.7L21 13"/>
                        </svg>
                        <span>Повторить</span>
                        <span class="badge" id="redo-count">0</span>
                    </button>
                </div>
            </div>

            <div class="divider"></div>

            <button class="action-btn" id="reset-view">Сбросить вид</button>
            <button class="action-btn" id="export-png">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                <span>Экспорт PNG</span>
            </button>
            <button class="action-btn" id="clear">Очистить слой</button>
        </aside>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="/static/app.js"></script>
</body>
</html>
