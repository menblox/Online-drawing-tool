<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrawApp</title>
    <link rel="stylesheet" href="/static/theme.css">
    <link rel="stylesheet" href="/static/home.css">
</head>
<body data-theme="dark">
    <main class="home">
        <header class="home-header">
            <h1 class="logo">DrawApp</h1>
            <p class="tagline">Совместная рисовалка в браузере</p>
        </header>

        <nav class="menu">
            <button class="menu-item" data-action="solo">
                <div class="menu-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
                    </svg>
                </div>
                <div class="menu-text">
                    <span class="menu-title">Рисовать одному</span>
                    <span class="menu-sub">Чистый холст, все инструменты</span>
                </div>
            </button>

            <button class="menu-item" data-action="coop">
                <div class="menu-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                </div>
                <div class="menu-text">
                    <span class="menu-title">Рисовать с другом</span>
                    <span class="menu-sub">Создать комнату и позвать</span>
                </div>
            </button>

            <button class="menu-item" data-action="join">
                <div class="menu-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                        <polyline points="10 17 15 12 10 7"/>
                        <line x1="15" y1="12" x2="3" y2="12"/>
                    </svg>
                </div>
                <div class="menu-text">
                    <span class="menu-title">Подключиться к другу</span>
                    <span class="menu-sub">Ввести код комнаты</span>
                </div>
            </button>
        </nav>

        <footer class="home-footer">
            <span>v0.1</span>
        </footer>
    </main>

    <!-- Модалка ввода кода -->
    <div class="modal-backdrop" id="modal-backdrop">
        <div class="modal">
            <h2 class="modal-title">Подключение к комнате</h2>
            <p class="modal-sub">Введите код, который прислал друг</p>
            <input type="text" class="modal-input" id="room-input" placeholder="например: a8k3m2x9" maxlength="20" autocomplete="off" spellcheck="false">
            <div class="modal-error" id="modal-error"></div>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-cancel" id="modal-cancel">Отмена</button>
                <button class="modal-btn modal-btn-primary" id="modal-submit">Подключиться</button>
            </div>
        </div>
    </div>

    <script type="module" src="/static/home.js"></script>
</body>
</html>
